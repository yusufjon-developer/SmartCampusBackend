ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [com.smartcampus.app.ApplicationKt.module]
  }
}

jwt {
  secret = ${JWT_SECRET}
  issuer = "http://localhost:"${ktor.deployment.port}
  audience = "smartcampus-users"
  realm = "SmartCampus Authentication"
  validityInMs = 86400000
}

db_smartcampus {
  driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
  host = "localhost"
  port = 1433
  user = "sa"
  password = ${DB_PASSWORD}
  name = "SmartCampus"

  encrypt = false // Для локальной разработки, true для продакшена
  trustServerCertificate = true // Для локальной разработки, false для продакшена

  maxPoolSize = 10
  minimumIdle = 5
  connectionTimeout = 30000
  idleTimeout = 600000
  maxLifetime = 1800000
  poolName = "SmartCampusPool"
}


db_auth {
  driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
  host = "localhost"
  port = 1433
  user = "sa"
  password = ${DB_PASSWORD}
  name = "SmartCampusAuth"

  encrypt = false // Для локальной разработки, true для продакшена
  trustServerCertificate = true // Для локальной разработки, false для продакшена

  maxPoolSize = 5
  minimumIdle = 2
  connectionTimeout = 30000
  idleTimeout = 600000
  maxLifetime = 1800000
  poolName = "SmartCampusAuthPool"
}
